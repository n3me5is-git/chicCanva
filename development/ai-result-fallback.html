<section id="aiGeneratedFallback" class="ai-generated-fallback hidden" aria-live="polite">
  <strong>Immagine generata</strong>
  <p id="aiGeneratedFallbackText" class="help">Il risultato è disponibile, ma non è ancora stato inserito nel progetto.</p>
  <button id="aiGeneratedFallbackPreview" class="ai-generated-fallback-preview" type="button" title="Apri l’anteprima grande">
    <img id="aiGeneratedFallbackImage" alt="Ultima immagine generata con Puter">
  </button>
  <div class="row ai-generated-fallback-actions">
    <button id="aiGeneratedRetryBtn" class="btn accent grow" type="button">Riprova inserimento</button>
    <button id="aiGeneratedDownloadBtn" class="btn" type="button">Scarica</button>
    <button id="aiGeneratedOpenBtn" class="btn" type="button">Apri</button>
  </div>
</section>
<dialog id="aiGeneratedDialog" class="chic-dialog ai-generated-dialog">
  <div class="ai-generated-dialog-head">
    <div><h2>Immagine generata</h2><p id="aiGeneratedDialogMeta" class="help"></p></div>
    <button id="aiGeneratedDialogClose" class="iconbtn" type="button" aria-label="Chiudi anteprima">×</button>
  </div>
  <div class="ai-generated-dialog-image"><img id="aiGeneratedDialogImage" alt="Anteprima grande dell’immagine generata"></div>
  <p id="aiGeneratedDialogStatus" class="status"></p>
  <div class="row ai-generated-dialog-actions">
    <button id="aiGeneratedDialogRetry" class="btn accent grow" type="button">Riprova inserimento</button>
    <button id="aiGeneratedDialogDownload" class="btn" type="button">Scarica</button>
    <button id="aiGeneratedDialogOpen" class="btn" type="button">Apri in nuova scheda</button>
  </div>
</dialog>
