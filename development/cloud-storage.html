<section class="card" id="cloudStorageCard" data-section="Cloud Storage">
  <div class="card-h"><div><div class="card-title">Cloud Storage</div><div class="card-sub">Apri, salva e sincronizza progetti con MEGA.</div></div></div>
  <div class="card-b">
    <div id="cloudUnavailable" class="cloud-notice hidden">Cloud Storage è disponibile solo quando chicCanva è pubblicata su HTTPS.</div>
    <div id="cloudSignedOut">
      <label class="small" for="cloudEmail">Email MEGA</label><input class="field" id="cloudEmail" type="email" autocomplete="username">
      <label class="small" for="cloudPassword">Password</label><input class="field" id="cloudPassword" type="password" autocomplete="current-password">
      <label class="check"><input id="cloudUse2fa" type="checkbox">Usa autenticazione a due fattori</label>
      <div id="cloud2faRow" class="hidden"><label class="small" for="cloud2faCode">Codice 2FA</label><input class="field" id="cloud2faCode" inputmode="numeric" autocomplete="one-time-code" maxlength="12"></div>
      <label class="check"><input id="cloudRememberSession" type="checkbox" checked>Salva sessione nel browser</label>
      <p class="help">Password e codice 2FA non vengono salvati. La sessione è cifrata nel database di questo browser.</p>
      <button class="btn accent cloud-wide" id="cloudLoginBtn" type="button">Accedi a MEGA</button>
    </div>
    <div id="cloudSignedIn" class="hidden">
      <div class="cloud-account-row"><div><strong id="cloudAccountName">MEGA</strong><div class="help" id="cloudAccountEmail"></div></div><button class="btn" id="cloudLogoutBtn" type="button">Logout</button></div>
      <div class="cloud-quota"><div class="cloud-quota-head"><strong>Spazio MEGA</strong><span id="cloudQuotaValue">—</span></div><div class="cloud-quota-track"><span id="cloudQuotaBar"></span></div></div>
      <button class="btn accent cloud-wide" id="openCloudExplorerBtn" type="button">Apri Cloud Storage</button>
    </div>
    <div class="status" id="cloudStatus" role="status"></div>
  </div>
</section>
