<dialog id="projectDialog" class="chic-dialog"><h2 id="projectDialogTitle">Nuovo progetto</h2><p id="projectDialogInfo"></p><label id="projectNameRow">Nome progetto<input class="field" id="projectNameInput" maxlength="100" value="Nuovo progetto"></label><div class="row"><button class="btn primary" id="projectConfirm">Crea progetto</button><button class="btn" id="projectExportClose">Esporta JSON e chiudi</button><button class="btn" id="projectCancel">Annulla</button></div></dialog>
<dialog id="pdfDialog" class="chic-dialog"><h2>Esporta PDF</h2><p id="pdfProjectInfo"></p><label class="check"><input type="radio" name="pdfScope" value="current" checked>Solo la pagina corrente</label><label class="check"><input type="radio" name="pdfScope" value="set">Tutte le pagine del progetto corrente</label><div class="row"><button class="btn primary" id="pdfConfirm">Esporta PDF</button><button class="btn" id="pdfCancel">Annulla</button></div></dialog>
<dialog id="renameDialog" class="chic-dialog"><h2 id="renameDialogTitle">Rinomina</h2><label>Nuovo nome<input class="field" id="renameInput" maxlength="100"></label><div class="row"><button class="btn primary" id="renameConfirm">Rinomina</button><button class="btn" id="renameCancel">Annulla</button></div></dialog>
<div class="object-menu hidden" id="projectTabMenu" role="menu" aria-label="Azioni progetto"><button data-project-action="rename" role="menuitem">Rinomina</button><button data-project-action="export" role="menuitem">Esporta JSON</button><button data-project-action="close" role="menuitem">Chiudi progetto</button></div>
<div class="object-menu hidden" id="pageTabMenu" role="menu" aria-label="Azioni pagina"><button data-page-action="rename" role="menuitem">Rinomina</button><button data-page-action="open" role="menuitem">Apri pagina</button><button data-page-action="duplicate" role="menuitem">Duplica pagina</button></div>
