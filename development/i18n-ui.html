<div class="language-picker language-picker-desktop" id="languagePickerDesktop" data-language-picker>
  <button class="btn language-trigger" type="button" data-language-trigger aria-haspopup="menu" aria-expanded="false" title="Lingua / Language"><span class="language-flag flag-it" data-language-flag aria-hidden="true"></span></button>
  <div class="language-menu hidden" role="menu">
    <button type="button" role="menuitemradio" data-language="it"><span class="language-flag flag-it" aria-hidden="true"></span> Italiano</button>
    <button type="button" role="menuitemradio" data-language="en"><span class="language-flag flag-gb" aria-hidden="true"></span> English</button>
  </div>
</div>
