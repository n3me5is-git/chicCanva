<section class="card" id="shapesCard">
  <div class="card-h"><div><div class="card-title">Forme e disegno</div><div class="card-sub">Forme didattiche, frecce, linee e disegno libero.</div></div></div>
  <div class="card-b">
    <div class="shape-tabs" id="shapeTabs" role="tablist" aria-label="Categorie forme">
      <button type="button" class="active" data-shape-filter="all">Tutte</button><button type="button" data-shape-filter="basic">Base</button><button type="button" data-shape-filter="school">Scuola</button><button type="button" data-shape-filter="arrows">Frecce</button><button type="button" data-shape-filter="draw">Disegno</button>
    </div>
    <div class="shape-tool-grid" id="shapeTools" role="toolbar" aria-label="Strumenti forme">
      <button type="button" data-shape="rect" data-shape-category="basic"><span>▭</span>Rettangolo</button><button type="button" data-shape="square" data-shape-category="basic"><span>□</span>Quadrato</button><button type="button" data-shape="roundrect" data-shape-category="basic"><span>▢</span>Arrotondato</button><button type="button" data-shape="ellipse" data-shape-category="basic"><span>⬭</span>Ovale</button><button type="button" data-shape="circle" data-shape-category="basic"><span>○</span>Cerchio</button><button type="button" data-shape="triangle" data-shape-category="basic"><span>△</span>Triangolo</button><button type="button" data-shape="diamond" data-shape-category="basic"><span>◇</span>Rombo</button><button type="button" data-shape="pentagon" data-shape-category="basic"><span>⬠</span>Pentagono</button><button type="button" data-shape="hexagon" data-shape-category="basic"><span>⬡</span>Esagono</button><button type="button" data-shape="star" data-shape-category="basic"><span>☆</span>Stella</button><button type="button" data-shape="star8" data-shape-category="basic"><span>✧</span>Stella 8</button><button type="button" data-shape="heart" data-shape-category="basic"><span>♡</span>Cuore</button><button type="button" data-shape="moon" data-shape-category="basic"><span>☾</span>Luna</button>
      <button type="button" data-shape="sun" data-shape-category="school"><span>☀</span>Sole</button><button type="button" data-shape="cloud" data-shape-category="school"><span>☁</span>Nuvola</button><button type="button" data-shape="house" data-shape-category="school"><span>⌂</span>Casa</button><button type="button" data-shape="book" data-shape-category="school"><span>▤</span>Libro</button><button type="button" data-shape="scroll" data-shape-category="school"><span>▱</span>Pergamena</button><button type="button" data-shape="bookmark" data-shape-category="school"><span>⌑</span>Segnalibro</button><button type="button" data-shape="tag" data-shape-category="school"><span>◇</span>Etichetta</button><button type="button" data-shape="shield" data-shape-category="school"><span>♢</span>Scudo</button><button type="button" data-shape="check" data-shape-category="school"><span>✓</span>Spunta</button><button type="button" data-shape="cross" data-shape-category="school"><span>✕</span>Croce</button><button type="button" data-shape="plus" data-shape-category="school"><span>＋</span>Più</button><button type="button" data-shape="brace" data-shape-category="school"><span>{</span>Graffa</button><button type="button" data-shape="ribbon" data-shape-category="school"><span>⌁</span>Nastro</button><button type="button" data-shape="puzzle" data-shape-category="school"><span>♧</span>Puzzle</button><button type="button" data-shape="lightbulb" data-shape-category="school"><span>♙</span>Lampadina</button><button type="button" data-shape="callout" data-shape-category="school"><span>▱</span>Fumetto</button><button type="button" data-shape="thought" data-shape-category="school"><span>◌</span>Pensiero</button>
      <button type="button" data-shape="arrow" data-shape-category="arrows"><span>➜</span>Freccia</button><button type="button" data-shape="outline-arrow" data-shape-category="arrows"><span>⇢</span>Outline</button><button type="button" data-shape="double-arrow" data-shape-category="arrows"><span>↔</span>Doppia</button><button type="button" data-shape="updown-arrow" data-shape-category="arrows"><span>↕</span>Su / giù</button>
      <button type="button" data-shape="line" data-shape-category="draw"><span>╱</span>Segmento</button><button type="button" data-shape="arrowline" data-shape-category="draw"><span>↗</span>Linea freccia</button><button type="button" data-shape="polyline" data-shape-category="draw"><span>⌁</span>Spezzata</button><button type="button" data-shape="polygon" data-shape-category="draw"><span>⬙</span>Poligono</button><button type="button" data-shape="free-smooth" data-shape-category="draw"><span>〰</span>Mano liscia</button><button type="button" data-shape="free-raw" data-shape-category="draw"><span>⌇</span>Mano raw</button>
    </div>
    <div class="shape-pager"><button type="button" class="btn" id="shapePrevPage" aria-label="Pagina forme precedente">←</button><span id="shapePageInfo">1 / 1</span><button type="button" class="btn" id="shapeNextPage" aria-label="Pagina forme successiva">→</button></div>
    <p class="help">Scegli una forma e trascina sul foglio. Gli oggetti esistenti restano protetti durante il disegno.</p>
    <div class="shape-style-box">
      <div class="shape-color-row"><label>Riempimento <span class="shape-color-control"><input id="shapeFill" type="color" value="#ffffff" title="Colore riempimento forma"></span></label><label>Contorno <span class="shape-color-control"><input id="shapeStroke" type="color" value="#000000" title="Colore contorno forma"></span></label></div>
      <label class="check shape-transparent"><input id="shapeNoFill" type="checkbox">Riempimento trasparente</label>
      <label class="shape-range">Spessore contorno <strong id="shapeStrokeValue">3 px</strong><input id="shapeStrokeWidth" type="range" min="0" max="24" step="0.5" value="3"></label>
      <label class="check shape-node-mode"><input id="shapeDragNodes" type="checkbox">Crea segmenti trascinando tra i nodi</label>
    </div>
    <div class="row shape-edit-actions"><button class="btn" id="shapeEditPoints">Modifica punti</button><button class="btn" id="shapeDuplicateImage">Duplica come immagine</button></div>
    <div class="row shape-edit-actions"><button class="btn" id="shapeFinish">Termina tracciato</button><button class="btn" id="shapeCancel">Annulla disegno</button></div>
    <div class="status" id="shapeStatus" role="status">Scegli una forma o uno strumento di disegno.</div>
  </div>
</section>
